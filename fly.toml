app = "tabbycat" # Замените на ваше название
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Базовые настройки Django
  DJANGO_SETTINGS_MODULE = "settings.deploy"
  ALLOWED_HOSTS = "*.fly.dev"
  # Tabbycat специфичные переменные
  TABBYCAT_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024 # Tabbycat может быть требователен к памяти, 1GB — безопасный старт

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static"
